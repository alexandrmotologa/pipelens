name: Matrix Cross-Platform Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-matrix:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - os: windows-latest
            node: 18
        include:
          - os: ubuntu-latest
            node: 22
            experimental: true
            coverage: true
          - os: ubuntu-24.04-arm
            node: 22
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@1e60f671b99f2d1a33847e47d9f72844d184853b # v4.0.3
        with:
          node-version: ${{ matrix.node }}
      - name: Run Tests
        run: npm test
